apiVersion: apps/v1
kind: Deployment
metadata:
  name: categories-service
  namespace: my-shop
  labels:
    app: categories-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: categories-service
  template:
    metadata:
      labels:
        app: categories-service
        version: v1
    spec:
      containers:
        - name: categories-service
          image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-categories:latest
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://service-registry-service:8761/eureka/"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_DYNAMODB_CATEGORIES_TABLE
              value: "my-shop-dev-categories-table"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/v1/admin/categories/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/admin/categories/health
              port: 8086
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: categories-service
  namespace: my-shop
  labels:
    app: categories-service
spec:
  selector:
    app: categories-service
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
      name: http
  type: ClusterIP
