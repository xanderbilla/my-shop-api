spring.application.name=categories-service
server.port=8086
server.servlet.context-path=/api/v1

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# AWS Configuration
aws.region=us-east-1
aws.dynamodb.categories-table=my-shop-categories-table

# AWS Cognito Configuration for JWT verification
aws.cognito.region=${AWS_COGNITO_REGION:us-east-1}
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:us-east-1_Qst5LEWYk}

# Logging Configuration
logging.level.com.shop.categories=DEBUG
logging.level.software.amazon.awssdk=WARN

# Management and Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always