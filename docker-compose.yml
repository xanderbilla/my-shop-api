services:
  # Service Registry (Eureka Server) - Start first
  service-registry:
    image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-service-registry:latest
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - microservices-network
    restart: unless-stopped

  # API Gateway - Start after service registry
  api-gateway:
    image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - microservices-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-auth:latest
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - microservices-network
    restart: unless-stopped

  # Client Service
  client-service:
    image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-client:latest
    container_name: client-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - microservices-network
    restart: unless-stopped

  # User Service
  user-service:
    image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-user:latest
    container_name: user-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - microservices-network
    restart: unless-stopped

  # Categories Service
  categories-service:
    image: public.ecr.aws/k2g9v6r8/spring-microservice/shop-categories:latest
    container_name: categories-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-registry:8761/eureka/
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  eureka-data:
