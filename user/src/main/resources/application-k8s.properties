spring.application.name=user
server.port=8085
server.servlet.context-path=/api/v1/users

# Eureka client configuration for Kubernetes environment
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-registry-service:8761/eureka/}

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized